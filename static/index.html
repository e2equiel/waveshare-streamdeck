<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Deck Config</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Waveshare Stream Deck</h1>
            <p>Configura tus botones arrastrando o haciendo clic</p>
        </header>

        <div class="main-content">
            <div class="deck-grid" id="deckGrid">
                <!-- Buttons will be generated by JS -->
            </div>

            <div class="config-panel" id="configPanel">
                <h2>Configurar Botón <span id="currentBtn"></span></h2>
                <div class="form-group">
                    <label>Tipo de Acción</label>
                    <select id="actionType">
                        <option value="open_app">Abrir Aplicación</option>
                        <option value="hotkey">Atajo de Teclado</option>
                        <option value="shell">Comando Terminal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Valor (App name, keys...)</label>
                    <input type="text" id="actionPayload" placeholder="ej. Spotify o ['command', 'm']">
                </div>
                <div class="form-group">
                    <label>Ruta de Imagen (opcional)</label>
                    <input type="text" id="imagePath" placeholder="/ruta/a/imagen.png">
                </div>
                <button class="save-btn" id="saveBtn">Guardar</button>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
