<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">Stream Deck Configuration</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="desktop-window">
        <!-- Top Title Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="window-controls">
                    <span class="control-btn close"></span>
                    <span class="control-btn minimize"></span>
                    <span class="control-btn maximize"></span>
                </div>
                <h1 data-i18n="headerTitle">Stream Deck Controller</h1>
            </div>
            <div class="topbar-right">
                <select id="lang-select" class="lang-switcher">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </header>

        <div class="app-container">
            <!-- LEFT SIDEBAR (PROPERTIES) -->
            <aside class="sidebar sidebar-left">
                <h2 data-i18n="propertiesTitle">Properties</h2>
                <div id="properties-panel" style="display:none;" class="glass-panel">
                    <h3 id="prop-title" data-i18n="elementTitle">Element</h3>
                    <div class="form-group">
                        <label data-i18n="actionLabel">Action</label>
                        <select id="prop-action">
                            <option value="" data-i18n="actionNone">None</option>
                            <option value="open_app" data-i18n="actionOpenApp">Open App</option>
                            <option value="hotkey" data-i18n="actionHotkey">Hotkey</option>
                            <option value="switch_page" data-i18n="actionSwitchPage">Switch Page</option>
                            <option value="folder" data-i18n="actionFolder">Folder</option>
                            <option value="back_button" data-i18n="actionBackButton">Back Button</option>
                            <option value="media" data-i18n="actionMedia">Media Control</option>
                            <option value="text" data-i18n="actionText">Type Text</option>
                            <option value="multi_action" data-i18n="actionMulti">Multi-Action (Macro)</option>
                            <option value="clock" data-i18n="actionClock">Clock Widget</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="prop-payload-group">
                        <label id="prop-payload-label" data-i18n="payloadLabel">Payload</label>
                        <input type="text" id="prop-payload" placeholder="...">
                        <select id="prop-app-select" style="display:none;"></select>
                        <select id="prop-page-select" style="display:none;"></select>
                        <select id="prop-media-select" style="display:none;">
                            <option value="playpause" data-i18n="mediaPlayPause">Play / Pause</option>
                            <option value="nexttrack" data-i18n="mediaNext">Next Track</option>
                            <option value="prevtrack" data-i18n="mediaPrev">Previous Track</option>
                            <option value="volumeup" data-i18n="mediaVolUp">Volume Up</option>
                            <option value="volumedown" data-i18n="mediaVolDown">Volume Down</option>
                            <option value="volumemute" data-i18n="mediaMute">Mute</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="prop-macro-group" style="display:none; margin-top: 10px; border-top: 1px solid var(--glass-border); padding-top: 10px;">
                        <label data-i18n="macroSteps">Macro Steps</label>
                        <div id="macro-steps-list" style="display:flex; flex-direction:column; gap: 8px; margin-bottom: 8px; max-height: 200px; overflow-y:auto; padding-right: 5px;"></div>
                        <button id="btn-add-macro-step" class="btn secondary" style="width: 100%; font-size: 0.9rem;" data-i18n="btnAddMacroStep">+ Add Action</button>
                    </div>

                    <div class="form-group">
                        <label data-i18n="labelLabel">Label (Text on icon)</label>
                        <input type="text" id="prop-label" data-i18n-placeholder="labelPlaceholder" placeholder="e.g., Play, OBS...">
                    </div>
                    
                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <label style="margin:0;" data-i18n="imageLabel">Image</label>
                            <button id="btn-choose-icon" class="btn secondary" style="padding: 4px 8px; font-size: 0.8rem;" data-i18n="btnChooseIcon">Choose Icon</button>
                        </div>
                        <div id="prop-image-dropzone" class="dropzone">
                            <img id="prop-image-preview" src="" style="display:none;">
                            <div class="dropzone-text" id="prop-image-text">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                <p data-i18n="dragDropText">Drag & Drop</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="properties-empty" class="empty-state">
                    <p data-i18n="emptyStateText">Select an element on the canvas to edit its properties.</p>
                </div>
            </aside>

            <!-- CENTER CANVAS -->
            <main class="canvas-container">
                <div id="deck-wrapper">
                    <div id="deck-preview" class="deck-preview">
                        <!-- Rect elements injected dynamically based on /api/layout -->
                    </div>
                </div>
            </main>

            <!-- RIGHT SIDEBAR (DEVICE, PAGES, SETTINGS) -->
            <aside class="sidebar sidebar-right">
                <h2 data-i18n="deviceTitle">Device</h2>
                <div class="form-group" style="margin-bottom: 24px;">
                    <select id="device-select" class="form-control">
                        <!-- Devices injected here -->
                    </select>
                </div>
                
                <hr>
                
                <h2 data-i18n="pagesTitle">Pages</h2>
                <ul id="pages-list" class="list-group">
                    <!-- Pages will be injected here -->
                </ul>
                <div class="form-group row add-page-group">
                    <input type="text" id="new-page-name" data-i18n-placeholder="newPagePlaceholder" placeholder="Page name...">
                    <button id="btn-new-page" class="btn secondary icon-btn">+</button>
                </div>
                
                <div id="settings-panel" class="tab-pane">
                    <h2 data-i18n="settingsTitle">Settings</h2>
                    <div class="form-group">
                        <label data-i18n="brightnessLabel">Brightness</label>
                        <input type="range" id="brightness-slider" min="0" max="100" value="50">
                    </div>

                    <h3 data-i18n="smartProfilesTitle" style="margin-top:20px; margin-bottom: 10px; font-size: 1.1rem;">Smart Profiles</h3>
                    <p data-i18n="smartProfilesDesc" style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">
                        Automatically switch to a specific page when a macOS application becomes active.
                    </p>
                    <div id="smart-profiles-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom: 10px; max-height: 250px; overflow-y: auto; padding-right: 5px;"></div>
                    <button id="btn-add-profile" class="btn secondary" style="width: 100%; font-size: 0.9rem;" data-i18n="btnAddProfile">+ Add Smart Profile</button>
                </div>
                
                <div class="sidebar-footer">
                    <button id="btn-save-all" class="btn primary" data-i18n="btnSaveAll">Deploy / Save All</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- Icon Selector Modal -->
    <div id="icon-modal" class="modal">
        <div class="modal-content glass-panel" style="max-width: 800px; height: 80vh; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin:0;" data-i18n="iconTitle">Select an Icon</h3>
                <span class="close-modal" id="close-icon-modal">&times;</span>
            </div>
            <input type="text" id="icon-search" data-i18n-placeholder="searchIconPlaceholder" placeholder="Search icons..." style="margin-bottom: 16px;">
            <div id="icon-grid" class="icon-grid"></div>
        </div>
    </div>

    <!-- Cropper Modal -->
    <div id="crop-modal" class="modal">
        <div class="modal-content glass-panel">
            <h3 data-i18n="cropTitle">Adjust Image</h3>
            <div class="crop-container">
                <img id="crop-image" src="" alt="To crop">
            </div>
            <div class="modal-actions">
                <button id="btn-cancel-crop" class="btn secondary" data-i18n="btnCancel">Cancel</button>
                <button id="btn-apply-crop" class="btn primary" data-i18n="btnApply">Apply</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="app.js"></script>
</body>
</html>
