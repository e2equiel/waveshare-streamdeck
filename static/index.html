<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Deck Configuration</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar sidebar-left">
            <h2>Device</h2>
            <div class="form-group" style="margin-bottom: 20px;">
                <select id="device-select" class="form-control" style="width: 100%;">
                    <!-- Devices injected here -->
                </select>
            </div>
            
            <hr>
            
            <h2>Pages</h2>
            <ul id="pages-list" class="list-group">
                <!-- Pages will be injected here -->
            </ul>
            <div class="form-group row">
                <input type="text" id="new-page-name" placeholder="Page name...">
                <button id="btn-new-page" class="btn secondary">+</button>
            </div>
            
            <hr>
            
            <h2>Settings</h2>
            <div class="setting-group">
                <label>Brightness</label>
                <input type="range" id="brightness-slider" min="0" max="100" value="50">
            </div>
            
            <button id="btn-save-all" class="btn primary">Deploy / Save All</button>
        </aside>

        <!-- CENTER CANVAS -->
        <main class="canvas-container">
            <div id="deck-wrapper">
                <div id="deck-preview" class="deck-preview">
                    <!-- Rect elements injected dynamically based on /api/layout -->
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="sidebar sidebar-right">
            <h2>Properties</h2>
            <div id="properties-panel" style="display:none;">
                <h3 id="prop-title">Element</h3>
                <div class="form-group">
                    <label>Action</label>
                    <select id="prop-action">
                        <option value="">None</option>
                        <option value="open_app">Open App</option>
                        <option value="hotkey">Hotkey</option>
                        <option value="switch_page">Switch Page</option>
                        <option value="clock">Clock Widget</option>
                    </select>
                </div>
                
                <div class="form-group" id="prop-payload-group">
                    <label id="prop-payload-label">Payload</label>
                    <input type="text" id="prop-payload" placeholder="...">
                    <select id="prop-app-select" style="display:none;"></select>
                    <select id="prop-page-select" style="display:none;"></select>
                </div>
                
                <div class="form-group">
                    <label>Image</label>
                    <div id="prop-image-dropzone" class="dropzone">
                        <img id="prop-image-preview" src="" style="display:none;">
                        <div class="dropzone-text" id="prop-image-text">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                            <p>Drag & Drop</p>
                        </div>
                    </div>
                </div>
            </div>
            <div id="properties-empty">
                <p>Select an element on the canvas to edit its properties.</p>
            </div>
        </aside>
    </div>

    <!-- Cropper Modal -->
    <div id="crop-modal" class="modal">
        <div class="modal-content">
            <h3>Adjust Image</h3>
            <div class="crop-container">
                <img id="crop-image" src="" alt="To crop">
            </div>
            <div class="modal-actions">
                <button id="btn-cancel-crop" class="btn secondary">Cancel</button>
                <button id="btn-apply-crop" class="btn primary">Apply</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
